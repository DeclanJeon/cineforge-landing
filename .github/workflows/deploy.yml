name: Deploy

# Direct uploads from CI. Needs a Cloudflare API token with the "Cloudflare Pages: Edit"
# permission stored as CLOUDFLARE_API_TOKEN (plus CLOUDFLARE_ACCOUNT_ID).
# Without the secret this workflow is a no-op, so pushes stay green.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_CF_BEACON: ${{ vars.VITE_CF_BEACON }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name cineforge --branch main
