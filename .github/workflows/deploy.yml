name: Deploy

# Direct upload to Cloudflare Pages. Needs a Cloudflare API token with the
# "Cloudflare Pages: Edit" permission and the account id:
#   CLOUDFLARE_API_TOKEN  (secret)
#   CLOUDFLARE_ACCOUNT_ID (secret)
#   VITE_CF_BEACON        (variable, optional — Web Analytics)
# GitHub does not allow `secrets` in a job-level `if`, so the token is exposed
# as job env and the deploy step checks it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          VITE_CF_BEACON: ${{ vars.VITE_CF_BEACON }}
        run: |
          npm ci
          npm run build
          npx --yes wrangler@latest pages deploy dist --project-name cineforge --branch main

      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set — deploy skipped."
