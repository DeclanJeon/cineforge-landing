name: Sync release notes

# Rebuilds src/data/releases.json from the public GitHub releases of CineForge
# and the content-production skill pack. Product repositories send
# `release-published` right after publishing; the daily run is the fallback
# when that dispatch token is not configured (hourly, no secret needed).
on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the sync script
        run: npm test

      - name: Fetch releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-releases.mjs

      - name: Commit and deploy when releases changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/data/releases.json)" ]; then
            echo "releases unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/releases.json
          git commit -m "chore(releases): sync release notes"
          git push
          # Pushes made with the workflow token do not trigger other workflows.
          gh workflow run deploy.yml --ref main
